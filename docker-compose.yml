services:
  db:
    image: postgres:15
    container_name: siftc_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: siftc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-csharp:
    build:
      context: .
      dockerfile: dockerfile
    container_name: siftc_api_csharp
    ports:
      - "7123:8080" 
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=siftc_db;Username=postgres;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      - JwtSettings__Secret=${JWT_SECRET:?Define JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER:?Define JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE:?Define JWT_AUDIENCE}
      - JwtSettings__ExpiryMinutes=${JWT_EXPIRY_MINUTES:-480}
      - PythonBackend__BaseUrl=${PYTHON_BACKEND_URL:-https://backendfastapi-b3mt.onrender.com/}
      - PythonBackend__TimeoutSeconds=${PYTHON_BACKEND_TIMEOUT:-90}
      - Cors__AllowAnyOrigin=${CORS_ALLOW_ANY_ORIGIN:-true}

volumes:
  postgres_data:
